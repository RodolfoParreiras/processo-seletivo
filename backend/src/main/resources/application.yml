spring:
  application:
    name: processo-seletivo

  # Impede o usuário em memória com senha gerada e impressa no log (AI_RULES §14 e §30).
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}

  # Migrations executadas com o dono do schema; a aplicação usa um usuário apenas com DML.
  flyway:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    schemas: app
    default-schema: app
    create-schemas: false
    placeholders:
      appUser: ${DB_APP_USER}

  # Tabelas criadas pelas migrations (V001), nunca pela aplicação.
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC

  mvc:
    async:
      # Exportações grandes são escritas em fluxo na resposta.
      request-timeout: 5m

  servlet:
    multipart:
      # Limite técnico geral (edital). Documentos de candidatos têm limite próprio de 2 MB, aplicado no upload.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      # Padrão do candidato; sessões administrativas recebem prazo menor no login.
      timeout: 60m
      # Atributos do cookie em security/SessionCookieConfiguration.
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Indisponibilidade do SMTP não deve tornar a aplicação "não saudável" (AI_RULES §59/§60).
  health:
    mail:
      enabled: false

app:
  # URL pública usada nos links enviados por e-mail.
  public-url: ${APP_PUBLIC_URL}
  mail-from: ${MAIL_FROM}
  storage:
    # Diretório privado, fora de qualquer pasta servida pela web.
    path: ${STORAGE_PATH:/var/lib/processo-seletivo/storage}
  files:
    notice-max-size: 10MB
    # Documentos do candidato (docs/DECISOES.md).
    document-max-size: 2MB
    max-documents-per-application: 20
  scheduling:
    # Abertura/encerramento automático das inscrições pelas datas.
    enabled: ${SCHEDULING_ENABLED:true}
  security:
    candidate-session-idle-timeout: 60m
    admin-session-idle-timeout: 30m
    admin-session-absolute-timeout: 8h
    max-failed-login-attempts: 5
    account-lock-duration: 15m
    password-reset-token-validity: 30m
    password-setup-token-validity: 24h
    # Chave AES-256 (Base64) que cifra os segredos de MFA. Gerar com: openssl rand -base64 32
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY}
  # Provisionamento único do primeiro Administrador Geral (ver README).
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    cpf: ${BOOTSTRAP_ADMIN_CPF:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
