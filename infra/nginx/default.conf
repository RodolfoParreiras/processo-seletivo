# Ponto único de entrada: frontend e API na mesma origem, o que dispensa CORS
# e permite cookies de sessão SameSite=Strict (ESPECIFICACAO §41/§45).
#
# Este arquivo atende o ambiente local (HTTP em localhost). Em produção, o TLS deve
# terminar aqui ou no balanceador à frente, com HSTS habilitado (ESPECIFICACAO §47).

# Limite genérico por IP contra abuso.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
# Endpoints de autenticação: mais restritivo. A aplicação também bloqueia a conta após falhas seguidas.
# Folga para várias pessoas atrás do mesmo IP (ex.: rede da Prefeitura, telecentros).
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_status 429;

upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Uploads: 2 MB por arquivo (decisão de negócio) mais folga para o envelope multipart.
    client_max_body_size 3m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # X-Forwarded-For é sobrescrito, nunca acrescentado: o IP enviado pelo cliente não é confiável
    # e seria registrado na auditoria. Atrás de um balanceador, ajustar com real_ip.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Endpoints de gestão nunca são expostos publicamente; o healthcheck acessa o backend direto pela rede interna.
    location /actuator/ {
        return 404;
    }

    location ~ ^/api/(admin/)?auth/(login|register|forgot-password|reset-password|mfa/setup|mfa/verify)$ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://backend;
    }

    # Área administrativa: aceita o edital (até 10 MB).
    location /api/admin/ {
        client_max_body_size 11m;
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
