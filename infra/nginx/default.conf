# Ponto único de entrada: frontend e API na mesma origem, o que dispensa CORS
# e permite cookies de sessão SameSite=Strict (ESPECIFICACAO §41/§45).
#
# Este arquivo atende o ambiente local (HTTP em localhost). Em produção, o TLS deve
# terminar aqui ou no balanceador à frente, com HSTS habilitado (ESPECIFICACAO §47).

# Limite genérico por IP contra abuso; limites específicos por endpoint ficam na aplicação.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Uploads: 2 MB por arquivo (decisão de negócio) mais folga para o envelope multipart.
    client_max_body_size 3m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Endpoints de gestão nunca são expostos publicamente; o healthcheck acessa o backend direto pela rede interna.
    location /actuator/ {
        return 404;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
